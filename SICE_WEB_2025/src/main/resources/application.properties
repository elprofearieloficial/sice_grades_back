# ===============================
# CONFIGURACIÓN DEL POOL (HIKARI)
# ===============================
# Aumentamos de 10 (default) a 20 conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=40
# Tiempo máximo de vida de una conexión inactiva (10 minutos)
spring.datasource.hikari.idle-timeout=600000
# Tiempo máximo para esperar una conexión antes de dar error (30 segundos)
spring.datasource.hikari.connection-timeout=30000
# Mínimo de conexiones listas para usar
spring.datasource.hikari.minimum-idle=5